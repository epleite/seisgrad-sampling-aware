[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seisgrad"
version = "1.0.0"
description = "Sampling-aware gradient attributes for 3D seismic volumes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Emilson Pereira Leite", email = "emilson@unicamp.br"},
]
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
